# Baut Chatfenster für Linux (.deb) und Windows (ChatfensterSetup.exe),
# prüft mit einem Starttest, dass WhatsApp Web den QR-Code zeigt,
# und hängt die Dateien an das veröffentlichte Release.
#
# - Release auf GitHub veröffentlichen  -> bauen, testen, Dateien anhängen
# - "Run workflow" von Hand               -> nur bauen und testen (Artefakte)
name: Bauen und veröffentlichen

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bauen (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            build: npm run dist:linux
            smoke: xvfb-run -a node tools/smoke-test.mjs dist/linux-unpacked/chatfenster --no-sandbox
            files: dist/*.deb
          - name: Windows
            os: windows-latest
            build: npm run dist:win
            smoke: node tools/smoke-test.mjs dist/win-unpacked/Chatfenster.exe
            files: dist/ChatfensterSetup.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # github-mirror.mjs: Release-Downloads über die API, siehe Kommentar im Skript
      - name: Abhängigkeiten installieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/github-mirror.mjs npm ci

      - name: Paket bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/github-mirror.mjs ${{ matrix.build }}

      - name: Starttest (QR-Code erscheint)
        run: ${{ matrix.smoke }}

      - name: Installer testen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process dist\ChatfensterSetup.exe -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          Stop-Process -Name Chatfenster -ErrorAction SilentlyContinue
          $exe = "$env:LOCALAPPDATA\Programs\Chatfenster\Chatfenster.exe"
          if (-not (Test-Path $exe)) { throw "Nicht installiert: $exe" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Chatfenster.lnk"
          if (-not (Test-Path $lnk)) { throw "Startmenü-Eintrag fehlt: $lnk" }
          Write-Host "Installiert: $exe"
          node tools/smoke-test.mjs $exe

          # Deinstallieren muss den Autostart-Eintrag mitnehmen
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-ItemProperty -Path $run -Name 'de.crazyjimpro.chatfenster' -Value "`"$exe`" --autostart" -Force | Out-Null
          Start-Process "$env:LOCALAPPDATA\Programs\Chatfenster\Uninstall Chatfenster.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Nach dem Deinstallieren noch vorhanden: $exe" }
          if (Get-ItemProperty -Path $run -Name 'de.crazyjimpro.chatfenster' -ErrorAction SilentlyContinue) {
            throw 'Autostart-Eintrag nach dem Deinstallieren noch vorhanden'
          }
          Write-Host 'Deinstallation sauber'

      - name: Paket testen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          test -x /opt/Chatfenster/chatfenster
          test -f /usr/share/applications/chatfenster.desktop
          xvfb-run -a node tools/smoke-test.mjs /usr/bin/chatfenster --no-sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: chatfenster-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: An Release anhängen
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefakte
          merge-multiple: true

      - name: Dateien hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artefakte
          gh release upload "${{ github.event.release.tag_name }}" artefakte/* \
            --repo "${{ github.repository }}" --clobber
